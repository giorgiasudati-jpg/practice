<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRACTICE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRACTICE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EFECE6">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="iniziale.js"></script>
<script src="store.js"></script>
<style>
/* Layout: "svizzero, less but better" (references di Giorgia, 2026-11-01: poster delle linee e della palla rossa, calendario a cerchi,
   menu numerato Industrial, arco WOVE, giorni impilati, percorso di cerchi rossi). Carta calda, inchiostro nero, UN solo rosso di segnale
   usato con parsimonia (oggi, il blocco attivo, le spunte). Archivo come le gemelle: numeri enormi e pesanti, testo normale,
   maiuscolo solo per i titoli brevi. Righe sottili al posto dei riquadri, cerchi al posto delle caselle. */
:root{
  --paper:#EFECE6; --ink:#121212; --red:#E3321C; --on-red:#FFFFFF;
  --mute:rgba(18,18,18,.55); --line:rgba(18,18,18,.16); --soft:rgba(18,18,18,.07); --faint:rgba(18,18,18,.24);
  color-scheme:light;
  --tabh:62px; --gut:20px;
}
/* sempre su carta chiara, come le references: niente tema scuro automatico (decisione di Giorgia, 2026-11-01) */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;line-height:1.42;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{padding:0 0 calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0))}
button,input,select,textarea{font:inherit;color:inherit}
/* tocco da app: niente ritardo del doppio tocco, niente selezione del testo, il tasto si abbassa quando lo premi */
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .08s,opacity .08s}
button:active:not(:disabled){transform:scale(.97);opacity:.8}
main{max-width:560px;margin:0 auto;padding:4px var(--gut) 24px}
h1,h2,h3{font-weight:800;margin:0;letter-spacing:-.02em;line-height:1}
h1{font-size:40px;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase;margin-bottom:12px}
h3{font-size:15px}
p{margin:0 0 10px}
.cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--mute)}
.mute{color:var(--mute)}
.heavy{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.05em;line-height:.85}
.nota{border-left:2px solid var(--ink);padding:2px 0 2px 12px;margin:10px 0}
section{padding:20px 0;border-top:1px solid var(--line)}
section:first-of-type,section.flush{border-top:0}
sup{font-size:10px;font-weight:600;vertical-align:top;position:relative;top:4px;letter-spacing:.02em}

/* testata */
/* testata ferma in alto mentre si scorre, sotto la tacca dell'iPhone */
#top{position:sticky;top:0;z-index:4;background:var(--paper);max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0)) var(--gut) 10px;display:flex;justify-content:space-between;align-items:center}
#top .word{font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:13px;display:flex;align-items:center;gap:7px}
#top .word i{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block}
#sync{font-size:11px;color:var(--mute);display:flex;gap:6px;align-items:center}
#sync i{width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:.5;display:inline-block}
#sync.warn i{background:var(--red);opacity:1}

/* data come nel calendario a cerchi */
.dh{padding:22px 0 4px}
.dh .n{font-size:132px}
.dh .meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
.dh .m{font-size:24px;text-transform:uppercase;line-height:1.05;letter-spacing:.01em}
.dh .y{font-size:24px;color:var(--mute);line-height:1.05}
.dh .w{font-size:24px}
.wk{margin-top:14px;font-size:13px}
.wk b{color:var(--red);font-weight:700}
.minihead{display:flex;justify-content:space-between;padding:12px 0 0;font-size:13px;color:var(--mute)}

/* le linee della catena */
.chainart{margin:6px 0 0}
.chainart svg{display:block;width:100%;height:auto}
.chainart .lab{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.chainart .lab b{font-size:15px}

/* pulsanti */
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.row>.btn{flex:1}
.btn.full{background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.wide{width:100%}
.btn:disabled{opacity:.3;cursor:default}
.btn.danger{border-color:var(--red);color:var(--red)}
.link{background:none;border:0;padding:8px 0;color:var(--mute);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}

/* scelta della giornata: tre caselle affiancate */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;border-left:1.5px solid var(--ink);background:transparent;padding:10px 4px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600}
.seg button:first-child{border-left:0}
.seg button small{font-weight:400;font-size:12px;opacity:.7}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:disabled{color:var(--faint)}

/* elenchi numerati come il menu Industrial */
.nl{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--faint)}
.nl li{display:grid;grid-template-columns:30px 1fr auto;gap:4px 8px;align-items:baseline;padding:11px 0 12px;border-top:1px solid var(--faint)}
.nl li sup{grid-row:1}
.nl .nm{font-size:27px;font-weight:420;letter-spacing:-.025em;line-height:1.05}
.nl .mn{font-size:27px;font-weight:420;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nl .f{grid-column:2/4;font-size:13px;color:var(--mute);line-height:1.35}
.nl li.on .nm,.nl li.on sup{color:var(--red)}
.nl button.nm{background:none;border:0;padding:0;text-align:left}

/* rituale come la lista dei giorni */
.check{display:flex;gap:14px;align-items:center;padding:10px 0;background:none;border:0;width:100%;text-align:left;min-height:56px;font-size:17px;line-height:1.3}
.check .box{width:26px;height:26px;border:1.5px solid var(--ink);border-radius:4px;flex:none;display:grid;place-items:center;color:var(--on-red)}
.check .box svg{width:16px;height:16px}
.check.on .box{background:var(--red);border-color:var(--red)}
.check.on .t{text-decoration:line-through;text-decoration-color:var(--red);color:var(--mute)}

/* seduta in corso: l'arco dei blocchi come WOVE */
.arc svg{display:block;width:100%;height:auto;overflow:visible}
.timer{font-size:clamp(100px,34vw,160px);text-align:center;margin:8px 0 2px}
.timer.over{color:var(--red)}
.tsub{text-align:center;color:var(--mute);margin-bottom:16px}
.ctrl{display:flex;gap:18px;justify-content:center;align-items:center;margin-bottom:12px}
.round{width:104px;height:104px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.round.paused{background:var(--red);color:var(--on-red)}
.distr{display:flex;flex-direction:column;align-items:center;gap:3px;width:104px;height:104px;justify-content:center;border:1.5px solid var(--ink);border-radius:50%;background:transparent}
.distr b{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.04em}
.distr span{font-size:9px;text-transform:uppercase;font-weight:700;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--faint);border-radius:8px;padding:9px 12px;background:transparent;font-size:15px;min-height:44px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bpmrow{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 0 8px}
.bpmrow .v{font-size:72px;min-width:116px;text-align:center}
.bpmrow .v small{display:block;font-size:10px;letter-spacing:.14em;font-weight:600;color:var(--mute);margin-top:6px}
.step{width:54px;height:54px;flex:none;font-size:16px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;font-weight:600}
.metro{display:flex;justify-content:center;margin-top:4px}
.metro .btn.on{background:var(--red);border-color:var(--red);color:var(--on-red)}
.box{border-top:1.5px solid var(--ink);padding-top:14px;margin-top:16px}
/* il tasto per andare avanti resta sotto il pollice, appena sopra la barra, anche mentre si scorre */
.stick{position:sticky;bottom:calc(var(--tabh) + 12px + env(safe-area-inset-bottom,0));z-index:3;box-shadow:0 0 0 10px var(--paper)}
textarea,input[type=text],input[type=number],input[type=time],input[type=email],input[type=password],select{width:100%;border:1px solid var(--faint);background:transparent;border-radius:8px;padding:11px 12px;font-size:16px}
textarea{min-height:76px;resize:vertical}

/* fatto */
.done .n{font-size:120px}
.done .n small{font-size:30px;letter-spacing:0;font-weight:500}
.pt{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:0}

/* calendario a cerchi */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 7px}
.cal .h{font-size:11px;text-align:center;color:var(--mute);text-transform:uppercase;font-weight:500}
.cal .d{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:inherit}
.cal .c{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--mute)}
.cal .ok .c{background:var(--ink);color:var(--paper)}
.cal .part .c{background:none;box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink);font-weight:600}
.cal .rest .c,.cal .fut .c,.cal .pre .c{background:none;box-shadow:inset 0 0 0 1.5px var(--faint);color:var(--faint)}
.cal .today .c{background:none;box-shadow:inset 0 0 0 2px var(--red);color:var(--red);font-weight:700}
.cal .today.ok .c{background:var(--red);box-shadow:none;color:var(--on-red)}
.cal .sel .c{outline:1.5px solid var(--ink);outline-offset:3px}
.cal .d i{width:4px;height:4px;border-radius:50%;background:var(--ink);visibility:hidden}
.cal .d.slot i{visibility:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--soft)}
.legend i.ok{background:var(--ink)}.legend i.part{background:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.legend i.today{background:var(--red)}.legend i.slot{width:4px;height:4px;background:var(--ink)}
.monthnav{display:flex;align-items:center;gap:22px;margin:4px 0 18px}
.monthnav button{background:none;border:0;font-size:26px;padding:6px 4px;min-width:48px;min-height:48px}
.big{display:flex;align-items:flex-end;gap:14px}
.big .n{font-size:132px}
.big .t{padding-bottom:10px}
.big .t b{display:block;font-size:22px;text-transform:uppercase;font-weight:500;line-height:1.05}

/* numeri */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.kpi{border-top:1.5px solid var(--ink);padding-top:10px}
.kpi .v{font-size:60px}
.kpi .v small{font-size:18px;font-weight:500;letter-spacing:0;color:var(--mute)}
.kpi .l{font-size:13px;color:var(--mute);margin-top:6px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:112px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:6px;background:var(--soft)}
.bar .t i{display:block;height:100%;background:var(--ink)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
svg text{font-family:Archivo,sans-serif}
.ex{padding:14px 0;border-top:1px solid var(--faint)}
.ex:first-child{border-top:0}
.ex .v{font-size:40px}

/* percorso del ciclo */
.route svg{display:block;width:100%;height:auto}
.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;font-size:12px;line-height:1.25}
.stations div{text-align:center}
.stations b{display:block;font-size:13px}
.wrow{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--faint);padding:14px 0}
.wrow .t{font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.wrow.on .t{color:var(--red)}
.wrow .o{font-size:14px;margin-top:6px}
.edit{background:none;border:0;padding:0;text-align:left;width:100%}

.sess{padding:12px 0;border-top:1px solid var(--faint)}
.sess:first-child{border-top:0}
.sess ul{margin:6px 0;padding-left:18px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--faint);border-radius:4px;margin-left:6px;vertical-align:2px}

/* barra in basso: blocchi neri come il "Close" di Industrial */
/* barra agganciata al fondo, larga quanto lo schermo: quattro caselle uguali, il numero sopra la voce */
#tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));z-index:5}
#tabs button{border:0;background:transparent;color:var(--paper);padding:6px 2px;border-radius:10px;font-weight:600;font-size:13px;height:calc(var(--tabh) - 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
#tabs button:active{transform:none}
#tabs button sup{opacity:.55;top:0;font-size:10px;line-height:1}
#tabs button.on{background:var(--paper);color:var(--ink)}
#tabs button.on sup{color:var(--red);opacity:1}
#tabs button .liv{position:absolute;top:8px;right:calc(50% - 26px);width:7px;height:7px;border-radius:50%;background:var(--red)}

/* finestre di modifica come un foglio che sale dal basso, come su iPhone */
dialog{border:0;border-radius:18px 18px 0 0;padding:0;background:var(--paper);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;max-height:calc(100dvh - 48px);overflow-y:auto;overscroll-behavior:contain}
dialog[open]{animation:sheet .22s ease-out}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
dialog::backdrop{background:rgba(10,10,10,.45)}
.frm{padding:10px var(--gut) calc(20px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:14px}
.frm::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--faint);align-self:center;margin-bottom:6px}
.frm .btns .btn{flex:1}
.frm label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.frm label input,.frm label textarea,.frm label select{font-weight:400}
.frm label.inline{flex-direction:row;align-items:center;gap:10px}
.frm label.inline input{width:22px;height:22px;accent-color:var(--red)}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
.login{max-width:420px;margin:30px auto}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
</style></head><body>
<header id="top"><span class="word"><i></i>practice</span><span id="sync"><i></i><span>…</span></span></header>
<main id="main"></main>
<nav id="tabs" hidden></nav>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
/* ===== utilità ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>{d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const hhmm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const GG=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const FOCUS=["","Dispersa","A tratti","Dentro"];
const GIORNATE={minimo:"Minimo",normale:"Normale",buona:"Buona"};
const P_=Store.DEMO?"practice-demo-":"practice-";
const loadLS=k=>{try{return JSON.parse(localStorage.getItem(P_+k)||"null");}catch(e){return null;}};
const saveLS=(k,v)=>{try{localStorage.setItem(P_+k,JSON.stringify(v));}catch(e){}};
const mins=n=>Math.round(n||0);
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2200);}

/* ===== stato ===== */
const S={sedute:{},esercizi:{},piano:null};
const ui={tab:loadLS("tab")||"oggi",month:ymd().slice(0,7),sel:ymd(),giornata:null,rit:{},again:false};
let LIVE=loadLS("live");
const saveLive=()=>saveLS("live",LIVE);

/* ===== il piano ===== */
const P=()=>S.piano||SEED.piano;
function weekOf(date){const p=P();const d=diffDays(p.inizio,date);if(d<0)return null;return p.calendario[Math.min(Math.floor(d/7),p.calendario.length-1)];}
const blockOf=k=>P().blocchi.find(b=>b.k===k);
const dayBlocks=g=>(P().giornate[g]||[]).map(blockOf).filter(Boolean);
const dayMin=g=>dayBlocks(g).reduce((a,b)=>a+(+b.min||0),0);
const exList=k=>Object.entries(S.esercizi).map(([id,e])=>({id,...e})).filter(e=>!e.archiviato&&(!k||e.blocco===k)).sort((a,b)=>(a.ordine||99)-(b.ordine||99));
function focusEx(k){const l=exList(k);return (l.find(e=>e.focus)||l[0]||{}).id||null;}

/* ===== giorni, catena, numeri ===== */
const sessOn=date=>Object.entries(S.sedute).map(([id,s])=>({id,...s})).filter(s=>s.data===date).sort((a,b)=>(a.inizio||"").localeCompare(b.inizio||""));
const inSlot=s=>!!s.inizio&&hhmm(new Date(s.inizio))<P().slot;
const mondayOf=date=>addDays(date,-((parseD(date).getDay()+6)%7));
function restsUpTo(date){let n=0;for(let d=mondayOf(date);d<=date;d=addDays(d,1))if(sessOn(d).some(s=>s.giornata==="riposo"))n++;return n;}
function dayInfo(date){
  const ss=sessOn(date),work=ss.filter(s=>s.giornata!=="riposo");
  const tot=work.reduce((a,s)=>a+(s.totale||0),0);
  const rest=ss.some(s=>s.giornata==="riposo");
  const ok=tot>=P().minimo-0.5;
  return {ss,work,tot,rest,ok,restOk:rest&&!ok&&restsUpTo(date)<=P().riposi,slot:work.some(inSlot)};
}
const kept=i=>i.ok||i.restOk;
function chain(){let d=ymd();if(!kept(dayInfo(d)))d=addDays(d,-1);let n=0;while(n<4000&&kept(dayInfo(d))){n++;d=addDays(d,-1);}return n;}
function bestChain(){const dates=Object.values(S.sedute).map(s=>s.data).sort();if(!dates.length)return 0;let best=0,cur=0;for(let d=dates[0];d<=ymd();d=addDays(d,1)){cur=kept(dayInfo(d))?cur+1:0;best=Math.max(best,cur);}return best;}
function exHist(id){
  const e=S.esercizi[id]||{},by={};
  for(const s of Object.values(S.sedute))for(const b of s.blocchi||[])if(b.es===id&&b.bpm)by[s.data]=Math.max(by[s.data]||0,+b.bpm);
  const pts=Object.entries(by).map(([data,bpm])=>({data,bpm})).sort((a,b)=>a.data.localeCompare(b.data));
  return {base:e.base&&e.base.bpm?e.base:null,pts};
}
function lastBpm(id){const h=exHist(id);return h.pts.length?h.pts[h.pts.length-1].bpm:(h.base?h.base.bpm:null);}

/* ===== metronomo e segnali (Web Audio: nessun file da scaricare) ===== */
const Audio_={ctx:null,get(){if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state!=="running")this.ctx.resume();return this.ctx;}};
const Metro={on:false,bpm:80,next:0,beat:0,timer:null,
  start(bpm){const c=Audio_.get();this.bpm=bpm;this.on=true;this.beat=0;this.next=c.currentTime+.08;clearInterval(this.timer);this.timer=setInterval(()=>this.tick(),25);},
  stop(){this.on=false;clearInterval(this.timer);},
  set(bpm){this.bpm=bpm;},
  tick(){const c=Audio_.ctx;while(this.next<c.currentTime+.12){click(this.next,this.beat%4===0);this.next+=60/this.bpm;this.beat++;}}
};
function click(t,acc,f){const c=Audio_.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.value=f||(acc?1650:1100);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(acc?.9:.5,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.08);}
function beep(){try{const c=Audio_.get(),t=c.currentTime;[0,.18,.36].forEach((d,i)=>click(t+d,true,i===2?1320:880));}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200]);}
/* lo schermo resta acceso durante la seduta */
let lock=null;
async function wake(){try{if(LIVE&&"wakeLock" in navigator&&!lock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>{lock=null;});}}catch(e){}}
function unwake(){try{lock&&lock.release();}catch(e){}lock=null;}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake();});

/* ===== seduta in corso ===== */
const elapsed=b=>b.ms+(b.run?Date.now()-b.run:0);
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+":"+pad(s%60);}
function startLive(g){
  const bl=dayBlocks(g).map(b=>{const es=b.esercizi?focusEx(b.k):null;return {k:b.k,nome:b.nome,prev:+b.min,ms:0,run:null,distr:0,es,bpm:es&&S.esercizi[es]&&S.esercizi[es].bpm?(lastBpm(es)||80):null,focus:0,nota:"",done:false};});
  if(!bl.length)return;
  LIVE={data:ymd(),giornata:g,settimana:(weekOf(ymd())||{}).n||null,inizio:new Date().toISOString(),i:0,ending:false,blocchi:bl};
  bl[0].run=Date.now();saveLive();ui.rit={};ui.again=false;wake();render();
}
const cur=()=>LIVE.blocchi[LIVE.i];
function pauseCur(){const b=cur();if(b.run){b.ms+=Date.now()-b.run;b.run=null;}}
async function finishLive(){
  pauseCur();Metro.stop();
  const bl=LIVE.blocchi.filter(b=>b.done||b.ms>30000).map(b=>{
    const e=b.es&&S.esercizi[b.es];
    return {k:b.k,nome:b.nome,prev:b.prev,min:Math.round(b.ms/6000)/10,es:b.es||null,esNome:e?e.nome:null,bpm:e&&e.bpm&&b.bpm?b.bpm:null,focus:b.focus||null,distr:b.distr,nota:b.nota||""};
  });
  const doc={data:LIVE.data,giornata:LIVE.giornata,settimana:LIVE.settimana,inizio:LIVE.inizio,fine:new Date().toISOString(),blocchi:bl,totale:Math.round(bl.reduce((a,b)=>a+b.min,0)*10)/10};
  LIVE=null;saveLive();unwake();
  if(bl.length){await Store.collection("pratica_sedute").add(doc);toast("Seduta salvata · "+mins(doc.totale)+"'");}
  else toast("Seduta chiusa senza minuti: non salvata");
  render();
}

/* ===== disegni ===== */
/* le linee della catena (dal poster delle linee e della palla rossa): ogni linea è un giorno di fila col minimo.
   Il fascio scende, curva e finisce nella palla di oggi; la figurina la spinge. Palla piena = oggi il minimo c'è. */
function chainArt(){
  const c=chain(),done=dayInfo(ymd()).ok;
  const n=Math.max(1,Math.min(c,40)),W=358,s=Math.min(6,Math.max(2.2,90/n)),R0=16,cx=64,cy=40;
  const bundle=(n-1)*s,yb=cy+R0+bundle,R=Math.max(34,bundle/2+4),bx=W-R-2,by=yb-R,H=Math.ceil(yb+6);
  let p="";
  for(let i=0;i<n;i++){const r=R0+i*s;p+=`<path d="M${(cx-r).toFixed(1)} 0V${cy}A${r.toFixed(1)} ${r.toFixed(1)} 0 0 0 ${cx} ${(cy+r).toFixed(1)}H${bx}"/>`;}
  const yh=yb-27.6,xh=bx-Math.sqrt(Math.max(0,R*R-(yh-by)*(yh-by)));
  return `<div class="chainart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c} giorni di fila: una linea per giorno">
    <g fill="none" stroke="var(--ink)" stroke-width="1.3" ${c?"":'stroke-dasharray="3 4" stroke-opacity=".4"'}>${p}</g>
    <circle cx="${bx}" cy="${by}" r="${R}" fill="${done?"var(--red)":"var(--paper)"}" stroke="var(--red)" stroke-width="${done?0:2.5}"/>
    ${figure(xh-1,yb)}</svg>
    <div class="lab"><b>${c?`${c} ${c===1?"giorno":"giorni"} di fila`:"Oggi si comincia"}</b><span class="cap">${c?"una linea per giorno":"la prima linea"}</span></div></div>`;
}
/* la figurina che spinge: mani in (x,y-24), piedi sulla linea più bassa */
function figure(x,y){
  return `<g transform="translate(${x.toFixed(1)} ${y}) scale(1.15)" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="-4.5" cy="-31.5" r="3.6" fill="var(--ink)" stroke="none"/>
    <path d="M-17 -13.5L-8 -25" stroke-width="5"/>
    <path d="M-8 -25L-1 -26.5M-8 -24L-1 -22" stroke-width="2.2"/>
    <path d="M-17 -13L-24 -6.5L-31 -0.5M-16 -13L-10 -7L-12.5 -0.5" stroke-width="2.6"/></g>`;
}
/* l'arco dei blocchi (da WOVE): il blocco attivo grande, gli altri sbiaditi e ruotati lungo la curva */
function arcHtml(L){
  const W=358,H=156,cx=-170,cy=78,r=230,step=15;
  let s=`<div class="arc"><svg style="overflow:hidden" viewBox="0 0 ${W} ${H}" role="img" aria-label="Blocco ${L.i+1} di ${L.blocchi.length}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--faint)"/>`;
  L.blocchi.forEach((b,j)=>{
    const d=j-L.i;if(Math.abs(d)>3)return;
    const a=d*step*Math.PI/180,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    if(!d){s+=`<circle cx="${x}" cy="${y}" r="4.5" fill="var(--red)"/>
      <text x="${x+20}" y="${y+22}" font-size="66" font-weight="800" letter-spacing="-3" fill="var(--ink)">${pad(j+1)}</text>
      <text x="${x+112}" y="${y-2}" font-size="19" font-weight="700" fill="var(--ink)">${esc(b.nome)}</text>
      <text x="${x+112}" y="${y+18}" font-size="14" fill="var(--ink)" fill-opacity=".55">${b.prev} minuti</text>`;return;}
    const tx=cx+(r+16)*Math.cos(a),ty=cy+(r+16)*Math.sin(a),deg=a*180/Math.PI;
    s+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--ink)" fill-opacity="${d<0?.7:.3}"/>
      <text x="${tx}" y="${ty}" transform="rotate(${deg.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})" dominant-baseline="middle" font-size="28" font-weight="800" letter-spacing="-1" fill="var(--ink)" fill-opacity="${d<0?.35:.16}">${pad(j+1)}</text>`;
  });
  return s+"</svg></div>";
}

/* ===== schermata OGGI ===== */
function dateHead(t){
  const d=parseD(t),w=weekOf(t);
  return `<div class="dh"><div class="n heavy">${d.getDate()}</div>
    <div class="meta"><div><div class="m">${MESI[d.getMonth()]}</div><div class="y">${d.getFullYear()}</div></div><div class="w">${GG[d.getDay()].slice(0,3).replace(/^./,c=>c.toUpperCase())}</div></div>
    ${w?`<div class="wk"><b>Settimana ${w.n}</b> · ${esc(w.titolo)}</div>`:""}</div>`;
}
function vOggi(){
  const t=ymd();
  if(LIVE&&LIVE.data!==t){
    const d=parseD(LIVE.data);
    return dateHead(t)+`<section><h2>Seduta aperta</h2><p>La seduta di ${GG[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} è rimasta aperta. Salvala con i minuti fatti, oppure scartala.</p>
      <div class="row"><button class="btn full" data-act="stale-save">Salvala</button><button class="btn" data-act="stale-drop">Scartala</button></div></section>`;
  }
  if(LIVE)return vLive();
  const info=dayInfo(t),h=dateHead(t)+chainArt();
  if(info.ss.length&&!ui.again)return h+vDone(info);

}
function vStart(t){
  const p=P(),w=weekOf(t);
  if(!w)return `<section><p>Il ciclo parte il ${parseD(p.inizio).getDate()} ${MESI[parseD(p.inizio).getMonth()]}.</p></section>`;
  if(!ui.giornata||!w.giornate.includes(ui.giornata))ui.giornata=w.giornate[0];
  const g=ui.giornata,bl=dayBlocks(g);
  const seg=Object.keys(GIORNATE).map(k=>{
    const open=w.giornate.includes(k),from=p.calendario.find(x=>x.giornate.includes(k));

  }).join("");
  const RIT=[["tel","Telefono in modalità concentrazione, lontano"],["pronta","Chitarra accordata, metronomo e cuffie pronti"],["chiaro","So cosa faccio: ho letto i blocchi"]];
  const allRit=RIT.every(([k])=>ui.rit[k]);
  const now=new Date(),late=hhmm(now)>=p.slot,rLeft=p.riposi-restsUpTo(t);
  return `<section><div class="nota">${esc(w.obiettivo)}</div></section>
  <section><div class="cap" style="margin-bottom:10px">Com'è la giornata</div><div class="seg">${seg}</div>
    <ol class="nl" style="margin-top:18px">${bl.map((b,i)=>`<li><sup>${pad(i+1)}</sup><span class="nm">${esc(b.nome)}</span><span class="mn">${b.min}'</span><span class="f">${esc(b.fonte)}</span></li>`).join("")}</ol></section>
  <section><div class="cap" style="margin-bottom:4px">Rituale d'inizio</div>
    ${RIT.map(([k,l])=>`<button class="check ${ui.rit[k]?"on":""}" data-act="rit" data-k="${k}"><span class="box">${ui.rit[k]?'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>':""}</span><span class="t">${l}</span></button>`).join("")}
    ${late?`<p class="mute" style="margin-top:8px;font-size:13px">Sono le ${hhmm(now)}, oltre lo slot delle ${p.slot}. Fallo lo stesso: conta per la catena, e il dato "prima delle ${p.slot}" dirà la verità.</p>`:""}
    <button class="btn ${allRit?"red":"full"} wide" style="margin-top:14px;min-height:58px;font-size:17px" data-act="start" ${allRit?"":"disabled"}>Inizia · ${dayMin(g)} minuti</button>
  </section>
  <section class="row sp"><button class="link" data-act="manual" data-d="${t}">Segna una seduta fatta senza app</button>
    ${rLeft>0?`<button class="link" data-act="rest" data-d="${t}">Oggi riposo</button>`:""}</section>`;
}
function vDone(info){
  const p=P();
  if(!info.work.length&&info.rest)return `<section><h2>Giorno di riposo</h2><p class="mute">${info.restOk?"Programmato: la catena tiene.":"Oltre i riposi della settimana: la catena si ferma qui."}</p>
    <div class="row"><button class="btn" data-act="unrest" data-d="${ymd()}">Annulla il riposo</button><button class="btn" data-act="again">Studio lo stesso</button></div></section>`;
  return `<section class="done"><div class="cap">${info.ok?'<span class="pt"></span>Minimo fatto':"Oggi finora"}</div>
    <div class="n heavy" style="margin-top:10px">${mins(info.tot)}<small>min</small></div>
    <p style="margin-top:12px">${info.ok?`Il minimo di ${p.minimo}' c'è.`:`Mancano ${mins(p.minimo-info.tot)}' al minimo.`} ${info.slot?`Prima delle ${p.slot}.`:`Fuori slot (dopo le ${p.slot}).`}</p></section>

}
function vLive(){
  const L=LIVE,b=cur(),bd=blockOf(b.k)||{},n=L.blocchi.length,last=L.i===n-1,d=parseD(L.data);
  const e=b.es&&S.esercizi[b.es];

    h+=exPicker(b,e);
    h+=`<button class="btn full wide stick" style="min-height:58px;margin-top:18px" data-act="endblock">Fine blocco →</button>

function exPicker(b,e){
  const l=exList(b.k);if(!l.length)return "";

  if(e){
    const lb=lastBpm(b.es);
    if(e.nota)h+=`<div class="nota" style="font-size:14px">${esc(e.nota)}</div>`;
    if(e.bpm){
      h+=bpmStepper(b);
      h+=`<p class="mute" style="text-align:center;font-size:13px">${lb?`Ultimo pulito: ${lb}`:"Primo giro"}${e.obiettivo?` · obiettivo ${e.obiettivo}`:""}</p>

}
const bpmStepper=b=>`<div class="bpmrow"><button class="step" data-act="bpm" data-v="-5">−5</button><button class="step" data-act="bpm" data-v="-1">−1</button>

  </section>`;

/* ===== schermata METRO ===== */
function lastDays(n){const t=ymd();return [...Array(n)].map((_,i)=>addDays(t,i-n+1));}
function weekStats(){
  const days=lastDays(7),infos=days.map(dayInfo),ss=infos.flatMap(i=>i.work),bl=ss.flatMap(s=>s.blocchi||[]);
  const foc=bl.filter(b=>b.focus).map(b=>b.focus);

function dayChart(days){
  const W=340,H=130,pb=18,mx=Math.max(P().minimo*2,...days.map(d=>dayInfo(d).tot)),bw=W/days.length,y=v=>H-pb-(v/mx)*(H-pb-8),t=ymd();
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Minuti suonati al giorno, ultimi 14 giorni">`;
  days.forEach((d,i)=>{const inf=dayInfo(d),x=i*bw+3,hgt=H-pb-y(inf.tot);
    if(inf.tot)s+=`<rect x="${x}" y="${y(inf.tot)}" width="${bw-6}" height="${hgt}" fill="${inf.ok?(d===t?"var(--red)":"var(--ink)"):"none"}" stroke="${d===t?"var(--red)":"var(--ink)"}" stroke-width="1.5"><title>${d}: ${mins(inf.tot)}'</title></rect>`;
    else s+=`<rect x="${x}" y="${H-pb-1.5}" width="${bw-6}" height="1.5" fill="currentColor" fill-opacity=".25"/>`;
    if(i%2===days.length%2||i===days.length-1)s+=`<text x="${x+(bw-6)/2}" y="${H-4}" text-anchor="middle" font-size="9" fill="currentColor" fill-opacity=".6">${parseD(d).getDate()}</text>`;});
  /* la linea del minimo sopra le barre, così si legge sempre */
  const ym=y(P().minimo);
  s+=`<line x1="0" x2="${W}" y1="${ym}" y2="${ym}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3"/><text x="0" y="${ym-5}" font-size="10" font-weight="700" fill="var(--ink)">minimo ${P().minimo}'</text>`;
  return s+"</svg>";
}
function bpmChart(hh,target){
  const pts=hh.pts,W=340,H=110,l=26,r=10,t=10,b=18;
  const vals=pts.map(p=>p.bpm).concat(hh.base?[hh.base.bpm]:[]).concat(target?[target]:[]);
  const lo=Math.min(...vals)-5,hi=Math.max(...vals)+5;
  const d0=pts[0].data,span=Math.max(1,diffDays(d0,pts[pts.length-1].data));
  const X=d=>l+(pts.length===1?(W-l-r)/2:diffDays(d0,d)/span*(W-l-r)),Y=v=>t+(1-(v-lo)/(hi-lo))*(H-t-b);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="BPM puliti nel tempo">`;
  const ref=(v,lab,dash)=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" stroke-opacity=".35" ${dash?'stroke-dasharray="2 3"':""}/><text x="${l-4}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="currentColor" fill-opacity=".6">${v}</text><text x="${W-r}" y="${Y(v)-4}" text-anchor="end" font-size="9" fill="currentColor" fill-opacity=".6">${lab}</text>`;
  if(target)s+=ref(target,"obiettivo",true);
  if(hh.base)s+=ref(hh.base.bpm,"partenza",false);
  s+=`<polyline fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round" points="${pts.map(p=>X(p.data)+","+Y(p.bpm)).join(" ")}"/>`;
  pts.forEach((p,i)=>{const lastP=i===pts.length-1;s+=`<circle cx="${X(p.data)}" cy="${Y(p.bpm)}" r="${lastP?5:3}" fill="${lastP?"var(--red)":"var(--ink)"}"><title>${p.data}: ${p.bpm} BPM</title></circle>`;});
  s+=`<text x="${l}" y="${H-4}" font-size="9" fill="currentColor" fill-opacity=".6">${parseD(d0).getDate()}/${parseD(d0).getMonth()+1}</text>`;
  return s+"</svg>";
}
function coachText(){
  const w=weekStats(),p=P(),wk=weekOf(ymd());
  const L=[`PRACTICE · resoconto ${w.days[0]} → ${w.days[6]}`,wk?`${p.nome} · settimana ${wk.n}: ${wk.titolo}`:"",
    `Giorni col minimo (${p.minimo}'): ${w.ok}/7 · prima delle ${p.slot}: ${w.slot}/7 · catena: ${chain()} (record ${bestChain()})`,
    `Minuti totali: ${mins(w.tot)}' · sedute: ${w.ss.length}`,
    `Concentrazione media: ${w.focus==null?"–":w.focus.toFixed(1)+"/3"} · "ero altrove" per seduta: ${w.distr==null?"–":w.distr.toFixed(1)}`,
    "Per blocco: "+(Object.entries(w.perBlock).map(([k,v])=>`${k} ${mins(v)}'`).join(" · ")||"–"),"","Giorno per giorno:"];
  w.days.forEach((d,i)=>{const inf=w.infos[i];L.push(`- ${d}: ${inf.rest&&!inf.tot?"riposo":mins(inf.tot)+"'"}${inf.ok?" ✓":""}${inf.slot?" (slot)":""}`);});
  L.push("","Esercizi:");
  exList().filter(e=>e.bpm).forEach(e=>{const hh=exHist(e.id);const wk7=hh.pts.filter(x=>x.data>=w.days[0]);if(wk7.length)L.push(`- ${e.nome}: ${wk7.map(x=>x.bpm).join(" → ")} BPM${hh.base?` (partenza ${hh.base.bpm})`:""}${e.obiettivo?` · obiettivo ${e.obiettivo}`:""}`);});
  const notes=w.ss.flatMap(s=>(s.blocchi||[]).filter(b=>b.nota).map(b=>`- ${s.data} · ${b.nome}: ${b.nota}`));
  if(notes.length)L.push("","Note:",...notes);
  return L.filter(x=>x!==null).join("\n");
}

function routeHtml(p,wk){
  const n=p.calendario.length,W=358,H=64,m=40,gap=(W-2*m)/Math.max(1,n-1),y=30,R=18;
  let s=`<div class="route"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Le ${n} settimane del ciclo"><path d="M0 ${y}H${W}" stroke="var(--ink)" stroke-width="1.3"/>`;
  p.calendario.forEach((w,i)=>{const x=m+i*gap,now=wk&&wk.n===w.n,past=wk&&w.n<wk.n;
    s+=`<circle cx="${x}" cy="${y}" r="${R}" fill="${now?"var(--red)":past?"var(--ink)":"var(--paper)"}" stroke="${now?"var(--red)":"var(--ink)"}" stroke-width="1.3"/>
      <text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="13" font-weight="800" fill="${now?"var(--on-red)":past?"var(--paper)":"var(--ink)"}">${pad(w.n)}</text>`;});
  s+=`</svg><div class="stations">${p.calendario.map(w=>`<div><b>${esc(w.titolo)}</b><span class="mute">dal ${parseD(addDays(p.inizio,(w.n-1)*7)).getDate()} ${MESI[parseD(addDays(p.inizio,(w.n-1)*7)).getMonth()].slice(0,3)}</span></div>`).join("")}</div></div>`;
  return s;
}

function form(title,fields,vals,onSave,opts={}){
  const d=$("#dlg");
  const f=x=>{const v=vals[x.k]??"";
    if(x.t==="textarea")return `<label>${x.l}<textarea name="${x.k}">${esc(v)}</textarea></label>`;
    if(x.t==="select")return `<label>${x.l}<select name="${x.k}">${x.o.map(([ov,ol])=>`<option value="${esc(ov)}" ${String(ov)===String(v)?"selected":""}>${esc(ol)}</option>`).join("")}</select></label>`;
    if(x.t==="check")return `<label class="inline"><input type="checkbox" name="${x.k}" ${v?"checked":""}>${x.l}</label>`;
    return `<label>${x.l}<input type="${x.t||"text"}" name="${x.k}" value="${esc(v)}" ${x.t==="number"?'inputmode="decimal" step="any"':""}></label>`;};
  d.innerHTML=`<form class="frm" method="dialog"><h2>${esc(title)}</h2>${opts.intro?`<p class="mute">${opts.intro}</p>`:""}
    ${fields.map(x=>Array.isArray(x)?`<div class="two">${x.map(f).join("")}</div>`:f(x)).join("")}
    <div class="btns">${opts.del?'<button type="button" class="btn danger" data-fx="del">Elimina</button>':""}<span style="flex:1"></span>
    <button type="button" class="btn" data-fx="close">Annulla</button><button class="btn full" value="ok">Salva</button></div></form>`;
  const fm=d.querySelector("form");
  fm.onsubmit=e=>{e.preventDefault();const out={};fields.flat().forEach(x=>{const el=fm.elements[x.k];out[x.k]=x.t==="check"?el.checked:x.t==="number"?(el.value===""?null:+el.value):el.value.trim();});d.close();onSave(out);};
  fm.querySelector('[data-fx="close"]').onclick=()=>d.close();
  if(opts.del)fm.querySelector('[data-fx="del"]').onclick=()=>{if(confirm(opts.delAsk||"Eliminare?")){d.close();opts.del();}};
  d.showModal();
}

    form(b.nome,[[{k:"nome",l:"Nome"},{k:"min",l:"Minuti",t:"number"}],{k:"obiettivo",l:"Obiettivo",t:"textarea"},{k:"fonte",l:"Fonte attiva"},{k:"come",l:"Come si fa",t:"textarea"},{k:"esercizi",l:"Ha esercizi (con BPM e metronomo)",t:"check"},{k:"pos",l:"Posizione (1 = primo)",t:"number"}],
      {...b,pos:i+1},v=>{const nb={...b,nome:v.nome||b.nome,min:v.min||b.min,obiettivo:v.obiettivo,fonte:v.fonte,come:v.come,esercizi:v.esercizi};
        const arr=p.blocchi.filter((_,j)=>j!==i);arr.splice(Math.max(0,Math.min(arr.length,(v.pos||i+1)-1)),0,nb);
        const order=arr.map(x=>x.k),gio=Object.fromEntries(Object.entries(p.giornate).map(([g,l])=>[g,order.filter(k=>l.includes(k))]));
        savePiano({blocchi:arr,giornate:gio});},
      {del:()=>{const gio=Object.fromEntries(Object.entries(p.giornate).map(([g,l])=>[g,l.filter(k=>k!==b.k)]));savePiano({blocchi:p.blocchi.filter((_,j)=>j!==i),giornate:gio});},delAsk:"Eliminare il blocco? Le sedute passate restano."});},
  newblock:()=>{const p=P();form("Nuovo blocco",[[{k:"nome",l:"Nome"},{k:"min",l:"Minuti",t:"number"}],{k:"obiettivo",l:"Obiettivo",t:"textarea"},{k:"fonte",l:"Fonte attiva"},{k:"come",l:"Come si fa",t:"textarea"},{k:"esercizi",l:"Ha esercizi (con BPM e metronomo)",t:"check"}],{min:10},
    v=>{if(!v.nome)return;const k=v.nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-")+"-"+Date.now().toString(36);savePiano({blocchi:[...p.blocchi,{k,...v,min:v.min||10}]});toast("Aggiunto: ora mettilo in una giornata");});},
  editex:el=>exForm(el.dataset.id),
  newex:()=>exForm(null),
  editrules:()=>{const p=P();form("Le regole",[{k:"minimo",l:"Minimo garantito (minuti)",t:"number"},{k:"slot",l:"Slot: prima delle",t:"time"},{k:"riposi",l:"Riposi a settimana che non spezzano la catena",t:"number"},{k:"nome",l:"Nome del ciclo"},{k:"coach",l:"Nota del coach",t:"textarea"}],p,
    v=>savePiano({minimo:v.minimo||p.minimo,slot:v.slot||p.slot,riposi:v.riposi??p.riposi,nome:v.nome||p.nome,coach:v.coach}));},
  signout:async()=>{if(confirm("Uscire da PRACTICE su questo dispositivo?")){await Store.signOut();location.reload();}},
  demoreset:()=>{if(confirm("Ricominciare la prova da capo?")){Object.keys(localStorage).filter(k=>k.startsWith("practice-demo-")).forEach(k=>localStorage.removeItem(k));location.reload();}}
};
function exForm(id){
  const p=P(),e=id?S.esercizi[id]:{blocco:(p.blocchi.find(b=>b.esercizi)||{}).k,bpm:true};
  form(id?e.nome:"Nuovo esercizio",[{k:"nome",l:"Nome"},{k:"blocco",l:"Blocco",t:"select",o:p.blocchi.filter(b=>b.esercizi).map(b=>[b.k,b.nome])},
    {k:"bpm",l:"Si misura in BPM",t:"check"},[{k:"base",l:"BPM di partenza",t:"number"},{k:"obiettivo",l:"BPM obiettivo",t:"number"}],
    {k:"focus",l:"Proponilo per primo nel suo blocco",t:"check"},{k:"nota",l:"Nota",t:"textarea"}],
    {...e,base:e.base?e.base.bpm:null},
    v=>{const data={...e,nome:v.nome||e.nome||"Esercizio",blocco:v.blocco,bpm:v.bpm,obiettivo:v.obiettivo,focus:v.focus,nota:v.nota,base:v.base?{...(e.base||{}),bpm:v.base}:null};
      if(v.focus)exList(v.blocco).filter(x=>x.id!==id&&x.focus).forEach(x=>Store.doc("pratica_esercizi/"+x.id).update({focus:false}));
      if(id)Store.doc("pratica_esercizi/"+id).set(data);else Store.collection("pratica_esercizi").add({...data,ordine:99});},
    id?{del:()=>Store.doc("pratica_esercizi/"+id).update({archiviato:true}),delAsk:"Togliere l'esercizio? I BPM delle sedute passate restano."}:{});
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el);}});
document.addEventListener("input",e=>{if(e.target.id==="bnota"&&LIVE){cur().nota=e.target.value;saveLive();}});

/* ===== disegno ===== */
function render(){
  if(!booted)return;
  const tabs=[["oggi","Oggi"],["costanza","Costanza"],["metro","Metro"],["piano","Piano"]];
  $("#tabs").hidden=false;
  $("#tabs").innerHTML=tabs.map(([k,l],i)=>`<button class="${ui.tab===k?"on":""}" data-act="tab" data-t="${k}"><sup>${pad(i)}</sup>${l}${k==="oggi"&&LIVE&&ui.tab!=="oggi"?'<span class="liv"></span>':""}</button>`).join("");
  $("#main").innerHTML=ui.tab==="costanza"?vCostanza():ui.tab==="metro"?vMetro():ui.tab==="piano"?vPiano():vOggi();
}
/* il timer si aggiorna da solo senza ridisegnare la pagina; il tempo si calcola dagli orari, quindi regge anche a schermo spento */
setInterval(()=>{
  if(!LIVE||LIVE.ending||ui.tab!=="oggi")return;
  const el=$("#timer");if(!el)return;
  const b=cur(),rem=b.prev*60000-elapsed(b);
  el.textContent=rem>=0?fmt(rem):"+"+fmt(-rem);el.classList.toggle("over",rem<0);
  if(rem<0&&b.run&&!b.beeped){b.beeped=true;saveLive();beep();render();}
},250);

/* ===== avvio ===== */
let booted=false;
Store.onStatus(st=>{const el=$("#sync");el.className=st.error||!st.online?"warn":"";
  el.lastChild.textContent=st.demo?"prova":!st.online?"offline":st.error?"non sincronizzato":st.pending?st.pending+" da inviare":"sincronizzato";
  if(st.error&&/relation|does not exist|schema cache/i.test(st.error))$("#main").innerHTML=`<section class="login"><h1>Manca il database</h1><p>Le tabelle di PRACTICE non ci sono ancora su Supabase. Esegui lo script <b>supabase/01-tabelle.sql</b> nell'SQL Editor, poi ricarica.</p></section>`;});
function subscribe(){
  Store.collection("pratica_sedute").onSnapshot(s=>{S.sedute=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));render();});
  Store.collection("pratica_esercizi").onSnapshot(s=>{S.esercizi=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));render();});
  Store.collection("pratica_piano").onSnapshot(s=>{const d=s.docs.find(x=>x.id==="ciclo");S.piano=d?d.data():null;render();});
}
/* primo accesso: se il piano non c'è ancora, lo scrive dal punto di partenza (una volta sola, mai sopra dati esistenti) */
Store.onPulled(async()=>{
  booted=true;
  if(!S.piano){
    await Store.doc("pratica_piano/ciclo").create(SEED.piano);
    for(const [id,e] of Object.entries(SEED.esercizi))await Store.doc("pratica_esercizi/"+id).create(e);
  }
  render();
});
function loginView(){
  $("#tabs").hidden=true;
  $("#main").innerHTML=`<section class="login"><h1>Entra in<br>Practice</h1><p class="mute" style="margin-top:10px">Stessa email e password di ENLIST e TRAIN. Lo fai una volta sola su ogni dispositivo.</p>
    <form id="lf"><input type="email" name="email" autocomplete="username" placeholder="Email" required><input type="password" name="pass" autocomplete="current-password" placeholder="Password" required>
    <button class="btn full" style="min-height:52px">Entra</button><p id="lerr" class="mute"></p></form></section>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const f=e.target;$("#lerr").textContent="Accesso…";
    try{await Store.signIn(f.email.value.trim(),f.pass.value);go();}catch(err){$("#lerr").textContent="Non entra: "+(err.message||err);}};
}
function go(){
  $("#main").innerHTML=`<section><p class="mute">Carico…</p></section>`;
  subscribe();Store.start();if(LIVE)wake();
}
if(Store.DEMO)window.DEMO_SEED=demoSeed();
function demoSeed(){
  /* modalità prova: il piano vero più dieci giorni inventati, per vedere calendario e grafici pieni */
  const sed={},t=ymd();
  for(let i=10;i>=1;i--){const d=addDays(t,-i);if(i===4)continue;
    const st=parseD(d);st.setHours(i%3?8:10,i%3?40:20);const tot=i===7?18:30+(i%4)*8;
    sed["demo-"+i]={data:d,giornata:"minimo",inizio:st.toISOString(),totale:tot,blocchi:[
      {k:"riscaldamento",nome:"Riscaldamento",prev:5,min:5,es:"legato-134",esNome:"Legato 1-3-4 / 1-2-4",bpm:70+(10-i)*2,focus:2,distr:1,nota:""},
      {k:"tecnica",nome:"Tecnica",prev:15,min:tot-15,es:"gambale-r2",esNome:"Chop Builder · Round 2",bpm:84+(10-i)*2,focus:i%2?3:2,distr:i%3,nota:i===2?"Chop pentatonici più sciolti sopra i 95":""},
      {k:"suonare",nome:"Suonare",prev:10,min:10,es:null,esNome:null,bpm:null,focus:3,distr:0,nota:""}]};}
  sed["demo-r"]={data:addDays(t,-4),giornata:"riposo",blocchi:[],totale:0};
  return {pratica_piano:{ciclo:SEED.piano},pratica_esercizi:SEED.esercizi,pratica_sedute:sed};
}
(async()=>{if(await Store.session())go();else loginView();})();
if("serviceWorker" in navigator&&!Store.DEMO&&location.protocol==="https:")navigator.serviceWorker.register("sw.js");
</script>
